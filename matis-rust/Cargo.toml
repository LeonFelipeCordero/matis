[package]
name = "matis-rust"
version = "0.1.0"
edition = "2024"
description = "Native Rust implementation of the Matis repository importer"
license = "MIT"

[lib]
name = "matis"
path = "src/matis/lib.rs"

[[bin]]
name = "matis"
path = "src/matis/main.rs"

[[bin]]
name = "matis-migrate"
path = "src/matis/migrate.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = "4.5"
sea-orm = { version = "1.1", default-features = false, features = ["macros", "sqlx-sqlite", "runtime-tokio-rustls"] }
sea-orm-migration = { version = "1.1", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
getrandom = "0.4"
libc = "0.2"
base64 = "0.22"
indexmap = { version = "2", features = ["serde"] }
tempfile = "3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "arbitrary_precision"] }
sha2 = "0.10"
streaming-iterator = "0.1"
tree-sitter = "0.27"
tree-sitter-language-pack = { version = "=1.20.0", default-features = false, features = ["serde"] }
unicode_names2 = "=1.3.0"
url = "2"

[profile.release]
lto = "thin"
strip = true
