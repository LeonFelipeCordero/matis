name: Matis CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matis:
    name: Matis
    if: >-
      github.repository == 'LeonFelipeCordero/matis' &&
      github.actor_id == github.repository_owner_id &&
      github.triggering_actor == github.repository_owner &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, matato-local]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: matis-rust
      - run: cargo build --manifest-path matis-rust/Cargo.toml --release --locked --bins
      - name: Require all configured checks to pass across the entire repository
        shell: bash
        run: |
          set -o pipefail
          matis-rust/target/release/matis check --f . --format json | tee "$RUNNER_TEMP/matis-check.json"
