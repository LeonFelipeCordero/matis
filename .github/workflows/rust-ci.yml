name: Rust CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    if: >-
      github.repository == 'LeonFelipeCordero/matis' &&
      github.actor_id == github.repository_owner_id &&
      github.triggering_actor == github.repository_owner &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, matato-local]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: matis-rust
      - run: cargo test --manifest-path matis-rust/Cargo.toml --locked --all-targets
      - run: cargo build --manifest-path matis-rust/Cargo.toml --release --locked --bins

  checks:
    name: Checks
    if: >-
      github.repository == 'LeonFelipeCordero/matis' &&
      github.actor_id == github.repository_owner_id &&
      github.triggering_actor == github.repository_owner &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, matato-local]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: matis-rust
      - run: cargo fmt --manifest-path matis-rust/Cargo.toml --check
      - run: cargo clippy --manifest-path matis-rust/Cargo.toml --locked --all-targets -- -D warnings
