name: Trusted CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: trusted-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate trusted event
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.repository == 'LeonFelipeCordero/matis' &&
      github.actor_id == github.repository_owner_id &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.state == 'open'))
    steps:
      - name: Record trusted event
        shell: bash
        run: |
          set -euo pipefail
          printf 'Validated %s for %s at %s (run %s, attempt %s).\n' \
            "$GITHUB_EVENT_NAME" "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Trusted checks
    needs: validate
    # The host and job-start hook authorize context; this label only routes the job.
    runs-on: matato-ci-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 90
    env:
      CI: 'true'
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Shared image: Ubuntu 24.04, nonroot ephemeral runner 2.338.2,
      # dotfiles 5e69f36ae6b4c9a6fd5e349ae4cc844f2181f459, Rust 1.100.0
      # with clippy/rustfmt, Bun 1.4.1, Python 3.12, Node 24.22.2, Matis 0.1.7 baked.
      - name: Verify baked toolchain versions
        shell: bash
        run: |
          test "$(bun --version)" = '1.4.1'
          [[ "$(rustc --version)" == 'rustc 1.100.0 '* ]]
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: bash -n scripts/release.sh
      - run: cargo fmt --manifest-path matis-rust/Cargo.toml --check
      - run: cargo test --manifest-path matis-rust/Cargo.toml --locked --all-targets
      - run: cargo clippy --manifest-path matis-rust/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo build --manifest-path matis-rust/Cargo.toml --release --locked --bins
      - name: Require all configured checks to pass across the entire repository
        shell: bash
        run: |
          set -o pipefail
          matis-rust/target/release/matis check --f . --format json | tee "$RUNNER_TEMP/matis-check.json"
      - run: bun install --no-save
        working-directory: dashboard
      - run: bun run build
        working-directory: dashboard
      - run: bun test
        working-directory: dashboard
      - run: bun run typecheck
        working-directory: dashboard
      - run: bun run lint
        working-directory: dashboard
